openapi: 3.1.0
info:
  title: 外包点评 API
  version: 1.0.0
  description: |
    外包点评一期接口契约（以实际 Controller 为准同步）。
    - 统一响应：`{code, message, data, traceId}`，成功 `code=0`。
    - 分页：`page` 从 1 开始，`size` 最大 100，响应 `data` 为 `{items, page, size, total}`。
    - 鉴权：用户端 `userBearer`（JWT aud=user），管理端 `adminBearer`（JWT aud=admin）。
    - 时间：接口按业务时区 `Asia/Shanghai` 输出 ISO-8601 字符串。
    - 不提供任何删除点评的接口；管理端处置只有通过、折叠、驳回（下架语义由投诉裁定执行）。
  contact:
    name: 外包点评
  license:
    name: Proprietary
    url: https://example.invalid/license
servers:
  - url: http://localhost:8080
    description: 本地开发
tags:
  - name: 公开
    description: 游客可访问，无需登录
  - name: 用户鉴权
    description: 注册、登录、实名、身份与通知
  - name: 用户内容
    description: 在职佐证、点评、举报、投诉举证
  - name: 管理端-鉴权
    description: 管理员登录与当前管理员
  - name: 管理端-审核
    description: 人工审核队列、批量处置与佐证核验
  - name: 管理端-投诉
    description: 投诉工单、举证、裁定、企业回应与黑名单
  - name: 管理端-公司
    description: 公司档案、候选池与合并
  - name: 管理端-用户
    description: 用户、封禁与贡献值管理
  - name: 管理端-导入
    description: 工商批量导入任务
  - name: 管理端-看板
    description: 数据看板与指标口径
  - name: 管理端-反馈与举报
    description: 反馈工单与举报处置
  - name: 管理端-审计与合规
    description: 审计日志与材料访问

paths:
  /api/health:
    get:
      tags: [公开]
      operationId: getHealth
      summary: 健康检查
      description: 数据库正常返回 200，异常返回 503，不返回连接串。
      security: []
      responses:
        '200':
          description: 服务与数据库正常
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HealthStatus'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/companies/search:
    get:
      tags: [公开]
      operationId: searchCompanies
      summary: 公司搜索
      description: 按名称、简称、城市、行业、别名检索；未评价公司同样进入结果；零结果返回空列表；写入 search_log。
      security: []
      parameters:
        - $ref: '#/components/parameters/Keyword'
        - $ref: '#/components/parameters/City'
        - $ref: '#/components/parameters/Industry'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: visitorId
          in: query
          required: false
          description: 匿名访客标识（也可通过 X-Visitor-Id 请求头传递）
          schema:
            type: string
            maxLength: 64
        - name: X-Visitor-Id
          in: header
          required: false
          schema:
            type: string
            maxLength: 64
      responses:
        '200':
          description: 搜索结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CompanyPage'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/companies/sitemap:
    get:
      tags: [公开]
      operationId: getCompanySitemap
      summary: 公司 sitemap 清单
      description: 仅返回 ACTIVE 且非旧 USCC 的公司，可按城市/行业分片。
      security: []
      parameters:
        - $ref: '#/components/parameters/City'
        - $ref: '#/components/parameters/Industry'
      responses:
        '200':
          description: sitemap 条目
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SitemapEntry'

  /api/companies/{uscc}:
    get:
      tags: [公开]
      operationId: getCompany
      summary: 公司详情
      description: 公司档案、综合分门槛文案、六维度均分、信息来源与企业回应数；旧 USCC 返回 redirectTo 供前台 301。
      security: []
      parameters:
        - $ref: '#/components/parameters/UsccPath'
      responses:
        '200':
          description: 公司详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CompanyDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/companies/{uscc}/reviews:
    get:
      tags: [公开]
      operationId: listCompanyReviews
      summary: 公司点评列表
      description: 仅返回 PUBLISHED / DISPUTED / FOLDED（折叠默认收起），按加权分排序。
      security: []
      parameters:
        - $ref: '#/components/parameters/UsccPath'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 点评列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ReviewPage'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/companies/{uscc}/responses:
    get:
      tags: [公开]
      operationId: listCompanyResponses
      summary: 已审核通过的企业回应
      description: 只返回 APPROVED 的企业回应；可选按 reviewId 过滤。
      security: []
      parameters:
        - $ref: '#/components/parameters/UsccPath'
        - name: reviewId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 企业回应列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/EnterpriseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [公开]
      operationId: submitCompanyResponse
      summary: 企业回应提交
      description: 经主体核验的企业凭投诉工单号提交 ≤500 字回应；过滤联系方式；审核通过后展示，不计分、不改状态。
      security: []
      parameters:
        - $ref: '#/components/parameters/UsccPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnterpriseResponseSubmitRequest'
      responses:
        '200':
          description: 已提交待审核
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                            example: PENDING
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/companies/report:
    post:
      tags: [用户内容]
      operationId: reportCompany
      summary: 用户上报公司
      description: 命中工商库/别名直接返回公司；未命中只进入 company_candidate 待核验池，不创建公司。
      security:
        - userBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyReportRequest'
      responses:
        '200':
          description: 上报结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CompanyReportResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/rankings:
    get:
      tags: [公开]
      operationId: listRankings
      summary: 双榜列表
      description: 推荐榜与待改善名单按城市与行业出；只展示样本数、低分集中度、争议率等可核对指标。
      security: []
      parameters:
        - $ref: '#/components/parameters/City'
        - $ref: '#/components/parameters/Industry'
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RankingType'
        - name: date
          in: query
          required: false
          description: 快照日期 YYYY-MM-DD，缺省为最近一次
          schema:
            type: string
            format: date
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: 榜单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RankingPage'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/rankings/history:
    get:
      tags: [公开]
      operationId: getRankingHistory
      summary: 榜单历史快照
      description: 返回指定日期的算法版本、参数与入榜公司快照。
      security: []
      parameters:
        - $ref: '#/components/parameters/City'
        - $ref: '#/components/parameters/Industry'
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RankingType'
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 历史榜单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RankingPage'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/appeals:
    post:
      tags: [公开]
      operationId: submitEnterpriseAppeal
      summary: 企业申诉表单
      description: 上传营业执照与加盖公章申诉函；未通过主体核验不生成工单、不改变点评状态。
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AppealRequest'
      responses:
        '201':
          description: 已受理，进入主体核验
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ComplaintCreatedResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/feedback:
    post:
      tags: [公开]
      operationId: submitFeedback
      summary: 帮助与反馈
      description: 生成工单进入后台，承诺 48 小时内首次响应。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackSubmitRequest'
      responses:
        '201':
          description: 工单已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FeedbackSubmitResult'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/track/visit:
    post:
      tags: [公开]
      operationId: trackVisit
      summary: 访问埋点
      description: 匿名 visitorId + 路径 + UA；不采集任何个人明文信息；同一访客一分钟内同路径去重。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackVisitRequest'
      responses:
        '204':
          description: 已记录（无响应体）
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/auth/sms/send:
    post:
      tags: [用户鉴权]
      operationId: sendSmsCode
      summary: 发送短信验证码
      description: 同一手机号 60 秒限 1 次；验证码 5 分钟有效、一次性。Mock 模式固定 123456 并输出服务端日志。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsSendRequest'
      responses:
        '200':
          description: 已发送
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SmsSendResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/login:
    post:
      tags: [用户鉴权]
      operationId: login
      summary: 短信验证码注册/登录
      description: 注册成功同事务生成固定匿名身份；单设备会话，新登录使旧 token 失效。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/logout:
    post:
      tags: [用户鉴权]
      operationId: logout
      summary: 退出登录
      description: 作废当前账号签发的会话。
      security:
        - userBearer: []
      responses:
        '200':
          $ref: '#/components/responses/OkEmpty'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users/me:
    get:
      tags: [用户鉴权]
      operationId: getMe
      summary: 当前用户
      security:
        - userBearer: []
      responses:
        '200':
          description: 用户信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users/me/realname:
    post:
      tags: [用户鉴权]
      operationId: verifyRealname
      summary: 身份证二要素核验
      description: 只存证件号哈希与掩码；连续 3 次失败锁定 24 小时；日志不得出现证件号。
      security:
        - userBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealnameRequest'
      responses:
        '200':
          description: 核验结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RealnameResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/users/me/verifications/{verificationId}/delete-material:
    post:
      tags: [用户鉴权]
      operationId: deleteMyVerificationMaterial
      summary: 提前删除佐证材料
      description: 删除原始与脱敏文件，保留核验结论与在职时间段；删除动作留痕。
      security:
        - userBearer: []
      parameters:
        - name: verificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 删除结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MaterialDeletionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/users/me/identity:
    get:
      tags: [用户鉴权]
      operationId: getMyIdentity
      summary: 当前匿名身份
      description: 返回固定别名、更换次数与下次可更换条件。
      security:
        - userBearer: []
      responses:
        '200':
          description: 匿名身份
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/IdentityDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users/me/identity/change:
    post:
      tags: [用户鉴权]
      operationId: changeIdentity
      summary: 更换匿名身份
      description: 60 贡献值 + 90 天冷却 + 自然年 2 次；不满足时 403 并返回差额与剩余天数。历史点评不迁移。
      security:
        - userBearer: []
      responses:
        '200':
          description: 更换成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/IdentityChangeResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/users/me/notifications:
    get:
      tags: [用户鉴权]
      operationId: listNotifications
      summary: 站内通知列表
      description: 五类时限通知不可退订；返回未读数与列表。
      security:
        - userBearer: []
      parameters:
        - name: unreadOnly
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 通知列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/NotificationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users/me/notifications/{notificationId}/read:
    post:
      tags: [用户鉴权]
      operationId: readNotification
      summary: 单条已读
      security:
        - userBearer: []
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          $ref: '#/components/responses/OkEmpty'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/users/me/notifications/read-all:
    post:
      tags: [用户鉴权]
      operationId: readAllNotifications
      summary: 全部已读
      security:
        - userBearer: []
      responses:
        '200':
          $ref: '#/components/responses/OkEmpty'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/verifications:
    get:
      tags: [用户内容]
      operationId: listMyVerifications
      summary: 我的在职佐证
      security:
        - userBearer: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 佐证列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/VerificationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [用户内容]
      operationId: submitVerification
      summary: 提交在职佐证
      description: 四类材料任选其一，必须填写公司 USCC 与在职年月区间；文件进入私有加密存储并生成脱敏副本。
      security:
        - userBearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerificationCreateRequest'
      responses:
        '200':
          description: 已提交待审核
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/VerificationItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/verifications/mine:
    get:
      tags: [用户内容]
      operationId: listMyVerificationsAlias
      summary: 我的在职佐证（兼容别名）
      security:
        - userBearer: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 佐证列表
          content:
            application/json:
              schema:
