                        $ref: '#/components/schemas/ImportJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/dashboard:
    get:
      tags: [管理端-看板]
      operationId: getDashboard
      summary: 数据看板
      description: 14 项指标 + 漏斗 + 三条健康红线，附口径说明与时间窗口。
      security:
        - adminBearer: []
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/City'
        - $ref: '#/components/parameters/Industry'
        - name: refresh
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 看板数据
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DashboardResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/feedback:
    get:
      tags: [管理端-反馈与举报]
      operationId: listAdminFeedback
      summary: 反馈工单列表
      security:
        - adminBearer: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/FeedbackStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 反馈列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FeedbackPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/feedback/{ticketId}/reply:
    post:
      tags: [管理端-反馈与举报]
      operationId: replyFeedback
      summary: 回复反馈工单
      security:
        - adminBearer: []
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackReplyRequest'
      responses:
        '200':
          $ref: '#/components/responses/OkEmpty'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/admin/reports:
    get:
      tags: [管理端-反馈与举报]
      operationId: listAdminReports
      summary: 举报处置列表
      security:
        - adminBearer: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ReportStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 举报列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ReportPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/reports/{reportId}/resolve:
    post:
      tags: [管理端-反馈与举报]
      operationId: resolveReport
      summary: 处置举报
      description: result 与 status 二选一（VALID / INVALID / HANDLED）。
      security:
        - adminBearer: []
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportResolveRequest'
      responses:
        '200':
          $ref: '#/components/responses/OkEmpty'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/audit-logs:
    get:
      tags: [管理端-审计与合规]
      operationId: listAuditLogs
      summary: 审计日志查询（超管）
      security:
        - adminBearer: []
      parameters:
        - name: actorId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          required: false
          schema:
            type: string
        - name: targetType
          in: query
          required: false
          schema:
            type: string
        - name: targetId
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 审计日志
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuditLogPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/materials/{type}/{id}/url:
    get:
      tags: [管理端-审计与合规]
      operationId: getMaterialSignedUrl
      summary: 生成材料签名 URL
      description: 仅内容管理员在核验/投诉举证场景可读；必须携带工单号；签名 URL 5 分钟有效；写审计。
      security:
        - adminBearer: []
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [VERIFICATION, REVIEW_EVIDENCE, COMPLAINT_EVIDENCE, COMPLAINT, COMPLAINT_LICENSE, COMPLAINT_LETTER]
        - name: id
          in: path
          required: true
          description: 材料实体 id（核验记录 id / 点评 id / 投诉举证 id / 投诉 id）
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: 签名 URL
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MaterialUrlResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 用户 JWT，aud=user
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 管理端 JWT，aud=admin

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 页码，从 1 开始
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      required: false
      description: 每页条数，最大 100
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Keyword:
      name: keyword
      in: query
      required: false
      description: 关键词
      schema:
        type: string
        maxLength: 100
    City:
      name: city
      in: query
      required: false
      schema:
        type: string
        enum: [北京, 上海, 深圳, 杭州, 广州, 成都]
    Industry:
      name: industry
      in: query
      required: false
      schema:
        type: string
        enum: [IT人力外包, IT项目外包]
    UsccPath:
      name: uscc
      in: path
      required: true
      description: 统一社会信用代码（18 位）
      schema:
        type: string
        minLength: 18
        maxLength: 18
    ReviewIdPath:
      name: reviewId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserIdPath:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CandidateIdPath:
      name: candidateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TicketId:
      name: ticketId
      in: query
      required: true
      description: 工单号（材料读取必填，需与材料实体匹配）
      schema:
        type: string
        maxLength: 64

  responses:
    OkEmpty:
      description: 操作成功
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 未登录或登录已失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 无权限，或业务资格不足
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 资源冲突（重复投诉、重复点评、状态非法迁移等）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: 触发限频，返回剩余等待秒数或可再次举报时间
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: 服务或数据库不可用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ApiResponse:
      type: object
      required: [code, message, traceId]
      properties:
        code:
          type: integer
          description: 业务码，0 为成功
          example: 0
        message:
          type: string
          example: OK
        data:
          description: 业务数据，可为对象、数组或 null
        traceId:
          type: string
          description: 请求链路标识，与响应头 X-Trace-Id 一致
    ErrorResponse:
      type: object
      required: [code, message, traceId]
      properties:
        code:
          type: integer
          description: 业务错误码
          example: 403
        message:
          type: string
          example: 无权限执行该操作
        data:
          type: [object, "null"]
        traceId:
          type: string

    HealthStatus:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [UP, DEGRADED]
        database:
          type: string
          enum: [UP, DOWN]

    ReviewStatus:
      type: string
      description: 点评 10 状态
      enum: [DRAFT, MACHINE_REVIEWING, PENDING_MANUAL, PUBLISHED, EDITING, WITHDRAWN, DISPUTED, FOLDED, REJECTED, REMOVED]
    VerificationBadge:
      type: string
      enum: [CURRENT, FORMER]
      description: CURRENT=在职中，FORMER=曾在职
    DimensionCode:
      type: string
      enum: [SALARY, WORK_REALITY, CONTRACT, PROJECT_QUALITY, MANAGEMENT, RECOMMEND]
    CompanySource:
      type: string
      enum: [BUSINESS_API, USER_REPORT, MANUAL]
    CompanyStatus:
      type: string
      enum: [ACTIVE, MERGED, OFFLINE]
    RealnameStatus:
      type: string
      enum: [UNVERIFIED, PENDING, VERIFIED]
    UserStatus:
      type: string
      enum: [ACTIVE, BANNED, DELETED]
    AdminStatus:
      type: string
      enum: [ACTIVE, DISABLED]
    IdentityStatus:
      type: string
      enum: [ACTIVE, RETIRED]
    ProofType:
      type: string
      enum: [LABOR_CONTRACT, BADGE, PAYROLL, COMPANY_EMAIL]
    VerificationStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]
    MaterialStatus:
      type: string
      enum: [ACTIVE, DELETED, PENDING_DELETE]
    EvidenceType:
      type: string
      enum: [LABOR_CONTRACT, BADGE, PAYROLL, COMPANY_EMAIL, PAYSLIP, CHAT_RECORD, OTHER]
    EvidenceGrade:
      type: string
      enum: [A, B, C, NONE]
    AdminRole:
      type: string
      enum: [CONTENT_ADMIN, SUPER_ADMIN]
    RankingType:
      type: string
      enum: [RECOMMEND, IMPROVE]
    ReportTargetType:
      type: string
      enum: [REVIEW, COMPANY]
    ReportReasonCode:
      type: string
      description: 举报原因码
      enum: [FALSE_INFO, ABUSIVE, ADVERTISING, PRIVACY, SPAM, OTHER]
    ReportStatus:
      type: string
      enum: [PENDING, VALID, INVALID, HANDLED]
    ReviewRejectReasonCode:
      type: string
      enum: [INSUFFICIENT_EVIDENCE, FALSE_CLAIM, ABUSIVE_LANGUAGE, ADVERTISING, PRIVACY, OTHER]
    VerificationRejectReasonCode:
      type: string
      enum: [MATERIAL_BLURRY, COMPANY_MISMATCH, PERIOD_INVALID, IDENTITY_MISMATCH, OTHER]
    NotificationType:
      type: string
      enum: [DISPUTE_STARTED, EVIDENCE_REMINDER, RULING_RESULT, VERIFICATION_REJECTED, APPEAL_RESULT]
    NotificationChannel:
      type: string
      enum: [INAPP, SMS, BOTH]
    ComplaintStatus:
      type: string
      enum: [PENDING_VERIFY, REJECTED, EVIDENCE_COLLECTING, PENDING_RULING, RULED_USER_WIN, RULED_COMPANY_WIN, RULED_INSUFFICIENT]
    ComplaintResult:
      type: string
      enum: [USER_WIN, COMPANY_WIN, INSUFFICIENT]
    EnterpriseResponseStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]
    ImportJobStatus:
      type: string
      enum: [RUNNING, SUCCESS, PARTIAL, FAILED]
    ImportTriggerType:
      type: string
      enum: [MANUAL, SCHEDULE]
    CandidateStatus:
      type: string
      enum: [PENDING, MATCHED, CREATED, REJECTED]
    FeedbackCategory:
      type: string
      enum: [ACCOUNT, VERIFICATION, APPEAL, REVIEW, OTHER]
    FeedbackStatus:
      type: string
      enum: [PENDING, REPLIED, CLOSED]
    ContributionReason:
      type: string
      enum: [VERIFICATION, REVIEW, FIRST_REVIEW_BONUS, VALID_REPORT, IDENTITY_CHANGE, ADMIN_ADJUST]

    PageMeta:
      type: object
      required: [page, size, total]
      properties:
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
          format: int64

    SitemapEntry:
      type: object
      required: [uscc, name]
      properties:
        uscc:
          type: string
        name:
          type: string
        updatedAt:
          type: [string, "null"]
          format: date-time

    CompanySummary:
      type: object
      required: [uscc, name]
      properties:
        uscc:
          type: string
        name:
          type: string
        shortName:
          type: [string, "null"]
        city:
          type: [string, "null"]
        industry:
          type: [string, "null"]
        companyType:
          type: [string, "null"]
        source:
          $ref: '#/components/schemas/CompanySource'
        reviewCount:
          type: integer
        avgScore:
          type: [number, "null"]
        scoreVisible:
          type: boolean
        hasReviews:
          type: boolean
    CompanyPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/CompanySummary'

    DimensionScore:
      type: object
      required: [code]
      properties:
        code:
          $ref: '#/components/schemas/DimensionCode'
        average:
          type: [number, "null"]
          description: 样本不足 3 条时为 null
        sampleCount:
          type: integer
        enoughSample:
          type: boolean

    CompanyDetail:
      type: object
      required: [uscc]
      properties:
        uscc:
          type: string
        name:
          type: [string, "null"]
        shortName:
          type: [string, "null"]
        city:
          type: [string, "null"]
        industry:
          type: [string, "null"]
        companyType:
          type: [string, "null"]
        source:
          $ref: '#/components/schemas/CompanySource'
        sourceLabel:
          type: [string, "null"]
          description: 信息来源展示文案
        status:
          $ref: '#/components/schemas/CompanyStatus'
        reviewCount:
          type: integer
        avgScore:
          type: [number, "null"]
        scoreVisible:
          type: boolean
        hasReviews:
          type: boolean
        scoreNote:
          type: [string, "null"]
          description: 如「评价不足，暂不评分」
        aliases:
          type: array
          items:
            type: string
        dimensions:
          type: array
          items:
            $ref: '#/components/schemas/DimensionScore'
        responseCount:
          type: integer
          description: 已审核通过的企业回应数
        redirectTo:
          type: [string, "null"]
          description: 旧 USCC 的主档 USCC，前台据此 301

    CompanyReportRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 64
        industry:
          type: string
          maxLength: 64
    CompanyReportResult:
      type: object
      properties:
        matched:
          type: boolean
        pending:
          type: boolean
        company:
          $ref: '#/components/schemas/CompanySummary'
        candidateId:
          type: [string, "null"]
          format: uuid

    ReviewDimension:
      type: object
      required: [code, score]
      properties:
        code:
          $ref: '#/components/schemas/DimensionCode'
        score:
          type: integer
          minimum: 1
          maximum: 5

    ReviewEvidence:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/EvidenceType'
        materialStatus:
          $ref: '#/components/schemas/MaterialStatus'
        maskedAt:
          type: [string, "null"]
          format: date-time

    ReviewItem:
      type: object
      required: [id, uscc, totalScore, status]
      properties:
        id:
          type: string
          format: uuid
        uscc:
          type: string
        companyName:
          type: [string, "null"]
        identityAlias:
          type: [string, "null"]
          description: 发布时匿名身份快照，如「匿名·K7F2」
        verificationBadge:
          oneOf:
            - $ref: '#/components/schemas/VerificationBadge'
            - type: "null"
        totalScore:
          type: integer
          minimum: 1
          maximum: 5
        content:
          type: string
        dimensions:
          type: array
          items:
            $ref: '#/components/schemas/ReviewDimension'
        tags:
          type: array
          items:
            type: string
        periodStart:
          type: [string, "null"]
        periodEnd:
          type: [string, "null"]
        city:
          type: [string, "null"]
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/ReviewEvidence'
        status:
          $ref: '#/components/schemas/ReviewStatus'
        aiConfidence:
          type: [number, "null"]
        aiFlags:
          type: array
          items:
            type: string
        aiRulesVersion:
          type: [string, "null"]
        publishedAt:
          type: [string, "null"]
          format: date-time
        editDeadline:
          type: [string, "null"]
          format: date-time
        editCount:
          type: integer
        disputeDeadline:
          type: [string, "null"]
          format: date-time
        everDisputed:
          type: boolean
        rejectReasonCode:
          type: [string, "null"]
        rejectMessage:
          type: [string, "null"]
        rejectRuleVersion:
          type: [string, "null"]
        withdrawnAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: [string, "null"]
          format: date-time
        collapsed:
          type: boolean
        collapseNote:
          type: [string, "null"]
        disputed:
          type: boolean
        remainingEdits:
          type: integer
        canAppeal:
          type: boolean
        editable:
          type: boolean
        enterpriseResponse:
          type: [object, "null"]
          additionalProperties: true

    ReviewPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ReviewItem'

    ReviewUpsertRequest:
      type: object
      properties:
        id:
          type: [string, "null"]
          format: uuid
          description: 草稿更新时的点评 id
        uscc:
          type: string
          minLength: 18
          maxLength: 18
        periodStart:
          type: string
          description: 在职起始月（YYYY-MM）
          pattern: '^\d{4}-\d{2}$'
        periodEnd:
          type: string
          description: 在职结束月（YYYY-MM）
          pattern: '^\d{4}-\d{2}$'
        totalScore:
          type: integer
          minimum: 1
          maximum: 5
        content:
          type: string
          minLength: 20
          maxLength: 2000
        dimensions:
          type: array
          minItems: 3
          items:
            $ref: '#/components/schemas/ReviewDimension'
        evidenceFileKey:
          type: string
        evidenceFileKeys:
          type: array
          items:
            type: string
        tags:
          type: object
          additionalProperties: true
          description: 模糊身份标签（外包类型/在职时间段/城市/项目类型），禁止具体项目名

    AppealReviewRequest:
      type: object
      properties:
        statement:
          type: [string, "null"]
          maxLength: 500

    UserProfile:
      type: object
      required: [id, realnameStatus, userState]
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: [string, "null"]
          description: 已登录用户手机号（掩码/脱敏展示由前端处理）
        realnameStatus:
          $ref: '#/components/schemas/RealnameStatus'
        userState:
          type: string
          enum: [GUEST, REGISTERED, REALNAME_VERIFIED, VERIFIED]
        contributionScore:
          type: integer
        status:
          $ref: '#/components/schemas/UserStatus'
        identity:
          $ref: '#/components/schemas/IdentityInfo'
        createdAt:
          type: string
          format: date-time

    SmsSendRequest:
      type: object
      required: [phone, scene]
      properties:
        phone:
